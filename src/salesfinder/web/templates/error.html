{% extends "base.html" %}
{% block title %}{{ title or "Error" }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title or "Error" }}</h1>
  <p class="alert alert-error" role="alert">{{ message }}</p>
  <p>{% if show_login %}<a href="/login">Go to sign in</a>{% else %}<a href="/">Back to Today</a>{% endif %}</p>
</section>
{% endblock %}
