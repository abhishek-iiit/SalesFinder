{% extends "base.html" %}
{% block title %}Set up your account{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Set up your account</h1>
  <p>You've been invited to SalesFinder as <strong>{{ invite.email }}</strong> ({{ invite.role }}).</p>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/invite/{{ token }}" class="stack">
    <label>Your name
      <input type="text" name="name" value="{{ name }}" autocomplete="name" maxlength="200" required autofocus>
    </label>
    <label>Password <span class="muted">(at least 12 characters)</span>
      <input type="password" name="password" autocomplete="new-password" minlength="12" required>
    </label>
    <label>Repeat password
      <input type="password" name="password_confirm" autocomplete="new-password" minlength="12" required>
    </label>
    <button type="submit" class="button">Create account</button>
  </form>
</section>
{% endblock %}
